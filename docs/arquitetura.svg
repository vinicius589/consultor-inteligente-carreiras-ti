<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 400" width="970" height="400" role="img" aria-label="Arquitetura do consultor: base JSON, validação, motor de inferência, lacunas, roadmap, relatório e interfaces">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .caixa { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
      .caixa-forte { fill: #4338ca; stroke: #4338ca; }
      .titulo { font: 600 13px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1e1b4b; }
      .titulo-claro { font: 600 13px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
      .detalhe { font: 400 11px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
      .detalhe-claro { font: 400 11px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e0e7ff; }
      .linha { stroke: #6366f1; stroke-width: 1.8; fill: none; }
      .numero { font: 700 10px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
      .legenda { font: 400 11px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="970" height="400" fill="#ffffff"/>

  <!-- 1. base de conhecimento -->
  <rect class="caixa" x="30" y="70" width="130" height="96" rx="10"/>
  <text class="titulo" x="95" y="92" text-anchor="middle">data/*.json</text>
  <text class="detalhe" x="95" y="110" text-anchor="middle">trilhas · perguntas</text>
  <text class="detalhe" x="95" y="126" text-anchor="middle">regras · recursos</text>
  <text class="detalhe" x="95" y="146" text-anchor="middle">fonte de verdade</text>

  <!-- 2. validação -->
  <rect class="caixa" x="195" y="70" width="130" height="96" rx="10"/>
  <text class="titulo" x="260" y="92" text-anchor="middle">base_conhecimento</text>
  <text class="detalhe" x="260" y="112" text-anchor="middle">carrega e valida</text>
  <text class="detalhe" x="260" y="128" text-anchor="middle">ids, pesos, regras</text>
  <text class="detalhe" x="260" y="148" text-anchor="middle">fail-fast</text>

  <!-- 3. motor -->
  <rect class="caixa-forte" x="360" y="58" width="150" height="120" rx="10"/>
  <text class="titulo-claro" x="435" y="82" text-anchor="middle">motor.py</text>
  <text class="detalhe-claro" x="435" y="102" text-anchor="middle">soma ponderada</text>
  <text class="detalhe-claro" x="435" y="118" text-anchor="middle">fatores de certeza</text>
  <text class="detalhe-claro" x="435" y="134" text-anchor="middle">penalidades e bônus</text>
  <text class="detalhe-claro" x="435" y="150" text-anchor="middle">ranking + confiança</text>
  <text class="detalhe-claro" x="435" y="166" text-anchor="middle">sensibilidade ±1</text>

  <!-- 4. lacunas -->
  <rect class="caixa" x="545" y="70" width="130" height="96" rx="10"/>
  <text class="titulo" x="610" y="92" text-anchor="middle">lacunas.py</text>
  <text class="detalhe" x="610" y="112" text-anchor="middle">skill gap</text>
  <text class="detalhe" x="610" y="128" text-anchor="middle">prioridade e horas</text>
  <text class="detalhe" x="610" y="148" text-anchor="middle">cobertura do nível</text>

  <!-- 5. roadmap -->
  <rect class="caixa" x="710" y="70" width="130" height="96" rx="10"/>
  <text class="titulo" x="775" y="92" text-anchor="middle">roadmap.py</text>
  <text class="detalhe" x="775" y="112" text-anchor="middle">pré-requisitos</text>
  <text class="detalhe" x="775" y="128" text-anchor="middle">3 fases + entregas</text>
  <text class="detalhe" x="775" y="148" text-anchor="middle">certificações</text>

  <!-- 6. relatorio -->
  <rect class="caixa" x="710" y="215" width="130" height="80" rx="10"/>
  <text class="titulo" x="775" y="238" text-anchor="middle">relatorio.py</text>
  <text class="detalhe" x="775" y="258" text-anchor="middle">Markdown + JSON</text>
  <text class="detalhe" x="775" y="276" text-anchor="middle">plano completo</text>

  <!-- interfaces -->
  <rect class="caixa" x="430" y="300" width="170" height="70" rx="10"/>
  <text class="titulo" x="515" y="325" text-anchor="middle">app.py · Streamlit</text>
  <text class="detalhe" x="515" y="344" text-anchor="middle">wizard em 3 etapas</text>
  <text class="detalhe" x="515" y="360" text-anchor="middle">gráficos e exportação</text>

  <rect class="caixa" x="150" y="300" width="170" height="70" rx="10"/>
  <text class="titulo" x="235" y="325" text-anchor="middle">main.py · CLI</text>
  <text class="detalhe" x="235" y="344" text-anchor="middle">execução em lote</text>
  <text class="detalhe" x="235" y="360" text-anchor="middle">gera relatórios</text>

  <!-- setas -->
  <path class="linha" d="M 160 118 L 193 118" marker-end="url(#seta)"/>
  <path class="linha" d="M 325 118 L 358 118" marker-end="url(#seta)"/>
  <path class="linha" d="M 510 118 L 543 118" marker-end="url(#seta)"/>
  <path class="linha" d="M 675 118 L 708 118" marker-end="url(#seta)"/>
  <path class="linha" d="M 775 166 L 775 213" marker-end="url(#seta)"/>
  <path class="linha" d="M 710 255 C 660 255, 640 335, 602 335" marker-end="url(#seta)"/>
  <path class="linha" d="M 710 265 C 560 265, 420 335, 322 335" marker-end="url(#seta)"/>

  <!-- números das camadas -->
  <circle cx="30" cy="70" r="11" fill="#4338ca"/>
  <text class="numero" x="30" y="74" text-anchor="middle">1</text>
  <circle cx="195" cy="70" r="11" fill="#4338ca"/>
  <text class="numero" x="195" y="74" text-anchor="middle">2</text>
  <circle cx="360" cy="58" r="11" fill="#4338ca"/>
  <text class="numero" x="360" y="62" text-anchor="middle">3</text>
  <circle cx="545" cy="70" r="11" fill="#4338ca"/>
  <text class="numero" x="545" y="74" text-anchor="middle">4</text>
  <circle cx="710" cy="70" r="11" fill="#4338ca"/>
  <text class="numero" x="710" y="74" text-anchor="middle">5</text>
  <circle cx="710" cy="215" r="11" fill="#4338ca"/>
  <text class="numero" x="710" y="219" text-anchor="middle">6</text>

  <text class="legenda" x="30" y="30">Fluxo de dados e responsabilidades — nenhuma regra fica no código Python</text>
</svg>
