<rect width="1200" height="650" rx="12" fill="#111827"/><rect width="1200" height="56" rx="12" fill="#242b39"/><circle cx="27" cy="28" r="7" fill="#f87171"/><circle cx="52" cy="28" r="7" fill="#fbbf24"/><circle cx="77" cy="28" r="7" fill="#34d399"/><text x="600" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#e5e7eb">PowerShell — execução local</text>
<text x="46" y="112" font-family="Consolas,monospace" font-size="22" fill="#86efac">PS C:\Projetos&gt; git clone https://github.com/vinicius589/consultor-inteligente-carreiras-ti.git</text>
<text x="46" y="158" font-family="Consolas,monospace" font-size="22" fill="#e5e7eb">PS C:\Projetos&gt; cd consultor-inteligente-carreiras-ti</text>
<text x="46" y="218" font-family="Consolas,monospace" font-size="22" fill="#86efac">PS C:\Projetos\consultor-inteligente-carreiras-ti&gt; python -m venv .venv</text>
<text x="46" y="264" font-family="Consolas,monospace" font-size="22" fill="#e5e7eb">PS ...&gt; .\.venv\Scripts\Activate.ps1</text>
<text x="46" y="310" font-family="Consolas,monospace" font-size="22" fill="#e5e7eb">(.venv) PS ...&gt; python -m pip install -r requirements.txt</text>
<rect x="35" y="353" width="1125" height="3" fill="#374151"/>
<text x="46" y="405" font-family="Consolas,monospace" font-size="22" fill="#86efac">(.venv) PS ...&gt; python -m streamlit run app.py</text>
<text x="46" y="457" font-family="Consolas,monospace" font-size="22" fill="#e5e7eb">Local URL: http://localhost:8501</text>
