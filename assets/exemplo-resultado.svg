<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550">
<rect width="1200" height="1550" fill="#f0f2f6"/><rect width="1200" height="58" fill="#fff"/><circle cx="28" cy="29" r="8" fill="#ff4b4b"/><text x="50" y="36" font-family="Arial,sans-serif" font-size="18" fill="#333">Streamlit app · exemplo após envio do formulário</text><rect x="120" y="84" width="960" height="1400" rx="12" fill="#fff"/>
<text x="165" y="130" font-family="Arial,sans-serif" font-size="17" fill="#555">CONSULTOR INTELIGENTE DE CARREIRAS EM TI</text>
<text x="165" y="180" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#262730">Exemplo de perfil informado</text>
<text x="165" y="222" font-family="Arial,sans-serif" font-size="19" fill="#444">Matemática: Alta · Atividade: Análise de dados · Ferramenta: Python</text>
<text x="165" y="252" font-family="Arial,sans-serif" font-size="19" fill="#444">Entrega: Análises para decisão · Ambiente: Dados e pesquisa</text>
<rect x="165" y="286" width="870" height="1" fill="#ddd"/>
<text x="165" y="337" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#262730">Resultado da análise</text>
<rect x="165" y="363" width="870" height="104" rx="8" fill="#dff3e4" stroke="#9bd2a9"/>
<text x="190" y="406" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176b35">Trilha recomendada: Ciência de Dados e Machine Learning</text>
<text x="190" y="442" font-family="Arial,sans-serif" font-size="18" fill="#245a35">Análise estatística, exploração de dados e criação de modelos preditivos.</text>
<text x="165" y="522" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#262730">Por que essa trilha foi recomendada?</text>
<circle cx="177" cy="562" r="5" fill="#555"/><text x="196" y="569" font-family="Arial,sans-serif" font-size="19" fill="#333">Você gosta de analisar dados e tem alta afinidade com matemática.</text>
<circle cx="177" cy="605" r="5" fill="#555"/><text x="196" y="612" font-family="Arial,sans-serif" font-size="19" fill="#333">Você prefere entregar análises que apoiam decisões.</text>
<circle cx="177" cy="648" r="5" fill="#555"/><text x="196" y="655" font-family="Arial,sans-serif" font-size="19" fill="#333">A combinação de análise, matemática e Python reforça o perfil analítico.</text>
<rect x="165" y="695" width="870" height="74" rx="8" fill="#f7f7f7" stroke="#ddd"/><text x="190" y="725" font-family="Arial,sans-serif" font-size="18" fill="#333">Pontuação da recomendação</text><text x="190" y="752" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#262730">8 pontos</text>
<text x="165" y="827" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#262730">Como o sistema chegou a essa indicação</text>
<rect x="165" y="848" width="870" height="134" rx="8" fill="#fff" stroke="#ddd"/><text x="190" y="884" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#333">1. As respostas viram um fato Perfil</text><text x="190" y="916" font-family="Arial,sans-serif" font-size="18" fill="#444">O motor de inferência compara afinidades, atividades, ferramentas,</text><text x="190" y="943" font-family="Arial,sans-serif" font-size="18" fill="#444">resultado desejado e ambiente de trabalho.</text>
<rect x="165" y="1000" width="870" height="134" rx="8" fill="#fff" stroke="#ddd"/><text x="190" y="1036" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#333">2. As regras adicionam evidências e pontos</text><text x="190" y="1068" font-family="Arial,sans-serif" font-size="18" fill="#444">As regras ativadas registram justificativas; o sistema soma a pontuação</text><text x="190" y="1095" font-family="Arial,sans-serif" font-size="18" fill="#444">e escolhe a trilha com maior valor.</text>
<rect x="165" y="1152" width="870" height="86" rx="8" fill="#fff8e6" stroke="#f0d28a"/><text x="190" y="1185" font-family="Arial,sans-serif" font-size="17" fill="#754b00">Exemplo demonstrativo calculado conforme as regras atuais do projeto.</text><text x="190" y="1213" font-family="Arial,sans-serif" font-size="17" fill="#754b00">A recomendação é uma orientação inicial, não uma decisão definitiva.</text>
<text x="600" y="1432" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#7c7c7c">Exemplo visual baseado no app.py e no motor de regras do repositório</text>
</svg>