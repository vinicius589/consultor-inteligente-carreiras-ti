[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consultor-inteligente-carreiras-ti"
version = "2.0.0"
description = "Sistema especialista com raciocínio ponderado para mapeamento de carreira em TI"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
exclude = ["legacy", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402", "I001"]
"app.py" = ["E402", "I001"]
"tools/*.py" = ["E402", "I001"]
"tests/*.py" = ["E402"]
